site_name: Tối ưu AI trên thiết bị biên
site_description: Course về huấn luyện, triển khai và đánh giá SSD MobileNet trên thiết bị biên

theme:
  name: material
  language: vi
  logo: assets/g2.png
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: amber
      toggle:
        icon: material/weather-night
        name: Giao diện tối
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Giao diện sáng
  favicon: assets/g1.png

nav:
  - Lab:
      - Tổng quan: lab/index.md
      - Trang chủ: index.md
      - Lộ trình khóa học: course.md
      - Lab 1 · Giới thiệu Edge AI:
          - Tổng quan: modules/01-edge-ai-introduction/index.md
          - Nội dung: modules/01-edge-ai-introduction/guide.md
          - PyTorch: modules/01-edge-ai-introduction/pytorch.md
          - TensorFlow/Keras: modules/01-edge-ai-introduction/tensorflow.md
          - Thực hành: modules/01-edge-ai-introduction/assignment.md
      - Lab 2 · Huấn luyện:
          - Tổng quan: modules/02-model-training/index.md
          - Huấn luyện SSD MobileNet: modules/02-model-training/training.md
          - Inference với OpenCV: modules/02-model-training/inference.md
          - Đánh giá chất lượng: modules/02-model-training/evaluation.md
          - FPS và độ trễ: modules/02-model-training/performance.md
          - CPU, RAM và hệ thống: modules/02-model-training/resources.md
      - Lab 3 · Lượng tử hóa mô hình:
          - Tổng quan: modules/03-model-quantization/index.md
          - Khái niệm và nguyên lý: modules/03-model-quantization/quantization.md
          - PTQ và Calibration: modules/03-model-quantization/ptq.md
          - QAT: modules/03-model-quantization/qat.md
          - FP32, FP16 và INT8: modules/03-model-quantization/formats.md
          - Đánh giá chất lượng và hiệu năng: modules/03-model-quantization/evaluation.md
          - Thực hành: modules/03-model-quantization/practice.md
      - Lab 4 · Cắt tỉa mô hình:
          - Tổng quan: modules/04-model-pruning/index.md
          - Nguyên lý và tiêu chí: modules/04-model-pruning/guide.md
          - Notebook thực hành: modules/04-model-pruning/practice.md
          - Unstructured pruning: modules/04-model-pruning/unstructured.md
          - Structured pruning: modules/04-model-pruning/structured.md
          - Đánh giá chất lượng và hiệu năng: modules/04-model-pruning/evaluation.md
          - Bài tập & nộp bài: modules/04-model-pruning/assignment.md
      - Lab 5 · FPS và độ trễ:
          - Tổng quan: modules/05-benchmark/index.md
          - Khung hướng dẫn: modules/05-benchmark/guide.md
          - Bài tập & nộp bài: modules/05-benchmark/assignment.md
      - Lab 6 · Tài nguyên và báo cáo:
          - Tổng quan: modules/06-resources/index.md
          - Khung hướng dẫn: modules/06-resources/guide.md
          - Bài tập & nộp bài: modules/06-resources/assignment.md
      - Lab 7 · Chưa đặt tên:
          - Tổng quan: modules/07-topic/index.md
          - Khung hướng dẫn: modules/07-topic/guide.md
          - Bài tập & nộp bài: modules/07-topic/assignment.md
      - Lab 8 · Chưa đặt tên:
          - Tổng quan: modules/08-topic/index.md
          - Khung hướng dẫn: modules/08-topic/guide.md
          - Bài tập & nộp bài: modules/08-topic/assignment.md
  - Lecture:
      - Tổng quan: lecture/index.md

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra:
  generator: false

extra_css:
  - stylesheets/extra.css

