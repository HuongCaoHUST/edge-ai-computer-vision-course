site_name: Computer Vision trên thiết bị biên
site_description: Course về huấn luyện, triển khai và đánh giá SSD MobileNet trên thiết bị biên

theme:
  name: material
  language: vi
  logo: assets/g2.png
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: amber
      toggle:
        icon: material/weather-night
        name: Giao diện tối
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Giao diện sáng
  favicon: assets/g1.png

nav:
  - Lab:
      - Tổng quan: lab/index.md
      - Trang chủ: index.md
      - Lộ trình khóa học: course.md
      - Lab 1 · Chuẩn bị môi trường:
          - Tổng quan: modules/01-environment/index.md
          - Nội dung & thực hành: modules/01-environment/guide.md
          - Bài tập & nộp bài: modules/01-environment/assignment.md
      - Lab 2 · Huấn luyện:
          - Tổng quan: modules/02-training/index.md
          - Hướng dẫn thực hành: modules/02-training/guide.md
          - Kiểm tra & nộp bài: modules/02-training/submission.md
      - Lab 3 · Inference với OpenCV:
          - Tổng quan: modules/03-inference/index.md
          - Khung hướng dẫn: modules/03-inference/guide.md
          - Bài tập & nộp bài: modules/03-inference/assignment.md
      - Lab 4 · Đánh giá chất lượng:
          - Tổng quan: modules/04-evaluation/index.md
          - Khung hướng dẫn: modules/04-evaluation/guide.md
          - Bài tập & nộp bài: modules/04-evaluation/assignment.md
      - Lab 5 · FPS và độ trễ:
          - Tổng quan: modules/05-benchmark/index.md
          - Khung hướng dẫn: modules/05-benchmark/guide.md
          - Bài tập & nộp bài: modules/05-benchmark/assignment.md
      - Lab 6 · Tài nguyên và báo cáo:
          - Tổng quan: modules/06-resources/index.md
          - Khung hướng dẫn: modules/06-resources/guide.md
          - Bài tập & nộp bài: modules/06-resources/assignment.md
      - Lab 7 · Chưa đặt tên:
          - Tổng quan: modules/07-topic/index.md
          - Khung hướng dẫn: modules/07-topic/guide.md
          - Bài tập & nộp bài: modules/07-topic/assignment.md
      - Lab 8 · Chưa đặt tên:
          - Tổng quan: modules/08-topic/index.md
          - Khung hướng dẫn: modules/08-topic/guide.md
          - Bài tập & nộp bài: modules/08-topic/assignment.md
  - Lecture:
      - Tổng quan: lecture/index.md

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra:
  generator: false

extra_css:
  - stylesheets/extra.css

